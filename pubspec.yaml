name: histar_mobile
description: TimeLens (HistAR) — Flutter client for HistAR BE REST API
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  flutter_secure_storage: ^9.2.4
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.5.3
  cached_network_image: ^3.4.1
  webview_flutter: ^4.13.0
  geolocator: ^14.0.1
  mobile_scanner: ^7.0.1
  url_launcher: ^6.3.1
  intl: ^0.20.2
  permission_handler: ^13.0.2
  panorama_viewer: ^2.0.7
  share_plus: ^12.0.2
  torch_light: ^2.0.0
  google_sign_in: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.example
